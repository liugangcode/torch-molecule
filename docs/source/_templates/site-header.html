<header class="tm-header">
  <a class="tm-wordmark" href="{{ pathto('index') }}" aria-label="torch-molecule home">
    <svg viewBox="0 0 34 34" width="30" height="30" fill="none" aria-hidden="true"><path d="M9 7 25 10 22 27 7 23Z M9 7 22 27 M7 23 25 10" stroke="currentColor" stroke-width="1.5"/><g fill="currentColor"><circle cx="9" cy="7" r="3.5"/><circle cx="25" cy="10" r="3.5"/><circle cx="22" cy="27" r="3.5"/></g><circle cx="7" cy="23" r="3.5" fill="var(--tm-accent)"/></svg>
    <span>torch-molecule</span>
  </a>
  <button class="tm-menu-toggle" aria-controls="tm-site-navigation" aria-expanded="false">Menu <span aria-hidden="true">☰</span></button>
  <nav class="tm-navigation" id="tm-site-navigation" aria-label="Main navigation">
    <a href="{{ pathto('overview') }}"{% if pagename in ['overview', 'install', 'additional'] or (pagename.startswith('api/') and not pagename.startswith('api/datasets/')) %} aria-current="page"{% endif %}>Documentation</a>
    <a href="{{ pathto('models') }}"{% if pagename == 'models' %} aria-current="page"{% endif %}>Models</a>
    <a href="{{ pathto('dataset') }}"{% if pagename == 'dataset' or pagename.startswith('api/datasets/') %} aria-current="page"{% endif %}>Datasets</a>
    <a href="{{ pathto('example') }}"{% if pagename == 'example' %} aria-current="page"{% endif %}>Examples</a>
    <a href="https://github.com/liugangcode/torch-molecule" class="tm-github">GitHub <span aria-hidden="true">↗</span></a>
  </nav>
  <form class="tm-search" role="search" action="{{ pathto('search') }}" method="get">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.5"/></svg>
    <input aria-label="Search documentation" name="q" placeholder="Search docs" autocomplete="off"/>
    <kbd aria-hidden="true">⌘ K</kbd>
  </form>
</header>
