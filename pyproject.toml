[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch_molecule"
version = "0.2.0"
description = "Deep learning packages for molecular discovery with a simple sklearn-style interface"
authors = [{name = "Gang Liu", email = "gliu7@nd.edu"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.2.0",
    "torch-geometric>=2.6.1",
    "numpy",
    "huggingface_hub>=0.22.2",
    "joblib>=1.3.2",
    "networkx>=3.2.1",
    "rdkit>=2023.9.5",
    "scikit_learn>=1.2.2",
    "scipy>=1.14.1",
    "tqdm>=4.66.2",
    "optuna>=4.0.0",
    "pyarrow>=14",
]

[project.urls]
"Homepage" = "https://github.com/liugangcode/torch-molecule"
"Bug Tracker" = "https://github.com/liugangcode/torch-molecule"
"Documentation" = "https://liugangcode.github.io/torch-molecule/"

[tool.setuptools.packages.find]
include = ["torch_molecule*"]
exclude = [
    "private*", 
    "tests*", 
    "old_*.py", 
    "**/old_*.py"
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.package-data]
"torch_molecule" = [
    "**/*.yaml",
    "**/*.json",
    "encoder/sand/LICENSE",
    "generator/genmol/LICENSE",
    "generator/genmol/NOTICE",
    "generator/demodiff/assets/*",
]

[tool.pytest.ini_options]
addopts = "--verbose"
testpaths = ["tests"]
markers = [
    "integration: tests that download models or require network access",
]

[project.optional-dependencies]
# Optional model requirements, as listed under "Additional Packages" in the README.
# torch-scatter needs the PyG wheel index for your torch/CUDA build (see README).
scatter = ["torch-scatter"]
grin = ["torch-scatter", "CombineMols"]
hf = ["torch>=2.6", "transformers"]
molgen = ["torch>=2.6", "transformers", "selfies>=2.1"]
molexar = ["torch>=2.6", "transformers>=5.8", "loguru"]  # plus Fragment-SELFIES and Molexar, not on PyPI
safe = ["torch>=2.6", "transformers", "safe-mol"]
genmol = [
    "transformers==4.57.1",
    "safe-mol>=0.2.1,<0.3",
]
dev = [
    "pytest>=7.0",
    "black",
    "isort",
    "flake8",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
